[project]
name = "qwen-tts-cli"
version = "0.1.0"
description = "Qwen3-TTS Click CLI"
requires-python = ">=3.10"
dependencies = [
  "click",
  "qwen-tts",
  "soundfile",
  "numpy==2.1.3",
  "transformers==4.57.3",
]

[project.optional-dependencies]
smolagents = [
  "smolagents>=1.24.0",
]

[project.scripts]
qwen-tts-cli = "qwen_tts_cli.cli:main"


[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
